name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.0'
      - run: rm -rf android
      - run: flutter create --project-name mountain_hunter.
      - run: sed -i "s/8.1.0/8.6.0/g" android/gradle/wrapper/gradle-wrapper.properties
      - run: sed -i "s/8.3/8.7/g" android/gradle.properties 2>/dev/null || true
      - run: sed -i '/<\/application>/i \ <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6482727132974147~1234567890"\/>' android/app/src/main/AndroidManifest.xml
      - run: flutter pub add shared_preferences google_mobile_ads
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mountain-hunter-100-levels
          path: build/app/outputs/flutter-apk/app-release.apk
