name: Build TAP DANA CUAN
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Fix android folder
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Update Icon
        run: |
          if [ -f "icon.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              cp icon.png "$dir/ic_launcher.png" || true
            done
          fi

      - name: Update App Name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="TAP DANA CUAN"/' android/app/src/main/AndroidManifest.xml || true

      - name: Add AdMob
        run: |
          FILE="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "APPLICATION_ID" "$FILE"; then
            sed -i '/<application/a \ <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>' "$FILE"
          fi

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: TAP-DANA-CUAN
          path: build/app/outputs/flutter-apk/app-release.apk
