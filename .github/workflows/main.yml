name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.1'
      - run: flutter create . --platforms=android
      - run: sed -i "s/8.1.0/8.5.2/g" android/settings.gradle
      - run: sed -i "s/gradle-.*-all.zip/gradle-8.7-all.zip/" android/gradle/wrapper/gradle-wrapper.properties
      - run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "APPLICATION_ID" "$MANIFEST"; then
            sed -i '/<application/a \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>' "$MANIFEST"
          fi
      - run: flutter pub upgrade
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
