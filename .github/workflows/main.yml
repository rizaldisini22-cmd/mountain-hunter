name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.0'
      - name: Fix and Build
        run: |
          cp lib/main.dart /tmp/my_game.dart
          rm -rf android
          flutter create --project-name mountain_hunter --org com.rizal.mountainhunter --platforms=android.
          cp /tmp/my_game.dart lib/main.dart
          flutter pub add shared_preferences
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mountain-hunter-FINAL-bola-rapi
          path: build/app/outputs/flutter-apk/app-release.apk
