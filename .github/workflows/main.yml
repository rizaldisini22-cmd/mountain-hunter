name: Build Bubble DANA Cuan
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix Gradle & Setup Bubble Icon
        run: |
          ls -lh
          cp IMG-20261004-WA1114.jpg icon.png || true
          cp *.jpg icon.png || true
          mkdir -p assets
          cp icon.png assets/icon.png || true
          # backup file penting
          cp -r lib lib_backup || true
          cp pubspec.yaml pubspec_backup.yaml || true
          # hapus android lama yg rusak
          rm -rf android
          echo "fixing gradle..."

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action
