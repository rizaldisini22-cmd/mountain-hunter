name: Build TAP DANA CUAN
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Fix
        run: sed -i 's/mountain-hunter/mountain_hunter/g' pubspec.yaml || true
      - name: Create Android
        run: flutter create --platforms=android --project-name mountain_hunter . || true
      - name: Icon
        run: |
          if [ -f "icon.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              cp icon.png $dir/ic_launcher.png || true
            done
          fi
      - name: Name
        run: sed -i 's/label="[^"]*"/label="TAP DANA CUAN"/' android/app/src/main/AndroidManifest.xml || true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: TAP-DANA-CUAN
          path: build/app/outputs/flutter-apk/app-release.apk
