name: Build TAP DANA CUAN
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Fix pubspec name
        run: sed -i 's/mountain-hunter/mountain_hunter/g' pubspec.yaml || true
      - name: Rebuild Android
        run: |
          rm -rf android
          flutter create --platforms=android --project-name mountain_hunter .
      - name: Set Name
        run: sed -i 's/label="[^"]*"/label="TAP DANA CUAN"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: TAP-DANA-CUAN
          path: build/app/outputs/flutter-apk/app-release.apk
