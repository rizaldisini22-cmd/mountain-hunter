name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Clean old android
        run: rm -rf android
      - name: Create android fresh
        run: flutter create . --platforms=android --project-name bubble_cuan --org com.bubblecuan.app
      - name: Install dependencies
        run: flutter pub get
      - name: Generate icons
        run: flutter pub run flutter_launcher_icons
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
