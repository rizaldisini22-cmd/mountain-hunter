name: Build Bubble DANA Cuan
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert Icon
        run: |
          pip install pillow
          python3 -c "from PIL import Image; import os; im=Image.open('icon.png') if os.path.exists('icon.png') else None; print('icon ok' if im else 'no icon')"
          mkdir -p assets
          cp icon.png assets/icon.png || true
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Recreate Project
        run: |
          cp -r lib lib_backup || true
          cp pubspec.yaml pubspec_backup.yaml || true
          rm -rf android
          flutter create . --project-name mountain_hunter --org com.rizaldi.bubblecuan
          rm -rf lib
          mv lib_backup lib
          mv pubspec_backup.yaml pubspec.yaml
          flutter pub get
      - name: Fix AdMob Crash
        run: |
          python3 -c "
          import pathlib
          p=pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s=s.replace('<application', '<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/>\n        <application')
              p.write_text(s)
          print('FIXED')
          "
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
